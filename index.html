<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mi Libro de Cuentas</title>
<style>
  :root {
    --bg-dark: #12161F;
    --panel-bg: rgba(26, 32, 44, 0.7);
    --panel-bg-solid: #1A202C;
    --glass-border: rgba(255, 255, 255, 0.06);
    --glass-highlight: rgba(255, 255, 255, 0.08);
    
    --ink: #E2E8F0;
    --ink-soft: #8A99AD;
    
    --accent: #4A82C5;
    --ok: #48BB78;
    --warn: #ED8936;
    --bad: #E53E3E;
    --radius: 14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body { 
    margin: 0; padding: 0; 
    background-color: var(--bg-dark);
    color: var(--ink); 
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    overflow-x: hidden; 
    min-height: 100vh;
  }

  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; position: relative; }

  .header {
    background: rgba(18, 22, 31, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--glass-border);
    position: sticky; top: 0; z-index: 40;
  }
  .title { font-weight: 700; font-size: 20px; margin: 0; letter-spacing: -0.3px; color: var(--ink); }
  .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; font-weight: 400; }

  main { flex: 1; padding: 16px 16px 100px; }

  .card {
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius); 
    padding: 16px; 
    margin-bottom: 14px;
  }

  .hero-figure { text-align: center; padding: 8px 0 4px; }
  .hero-label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; }
  .hero-amount { font-weight: 700; font-size: 32px; letter-spacing: -0.8px; margin-top: 4px; }
  .hero-amount.ok { color: var(--ok); }
  .hero-amount.warn { color: var(--warn); }
  .hero-amount.bad { color: var(--bad); }
  .hero-note { font-size: 12.5px; margin-top: 10px; padding: 10px 12px; border-radius: 8px; backdrop-filter: blur(8px); }
  .hero-note.ok { background: rgba(72, 187, 120, 0.1); color: #68D391; border: 1px solid rgba(72, 187, 120, 0.15); }
  .hero-note.warn { background: rgba(237, 137, 54, 0.1); color: var(--warn); border: 1px solid rgba(237, 137, 54, 0.15); }
  .hero-note.bad { background: rgba(229, 62, 62, 0.1); color: var(--bad); border: 1px solid rgba(229, 62, 62, 0.15); }

  .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--glass-border); font-size: 13.5px; }
  .row:last-child { border-bottom: none; }
  .row .label { color: var(--ink-soft); }
  .row .val { font-weight: 600; }
  .row .val.neg { color: #FC8181; }

  .clickable-row { cursor: pointer; user-select: none; }
  .clickable-row:active { opacity: 0.7; }

  .details-box {
    background: rgba(18, 22, 31, 0.5);
    border-radius: 10px;
    padding: 10px 12px;
    margin: 8px 0;
    border: 1px solid var(--glass-border);
    font-size: 12.5px;
  }

  h2.section-title { font-size: 15px; font-weight: 600; margin: 4px 0 10px; color: var(--ink); letter-spacing: -0.2px; }
  h3.sub-title { font-size: 11.5px; font-weight: 600; margin: 14px 0 6px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.6px; }

  .item { 
    background: var(--panel-bg); 
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border); 
    border-radius: var(--radius); 
    padding: 14px 16px; 
    margin-bottom: 10px; 
  }
  .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .item-name { font-weight: 600; font-size: 14.5px; }
  .item-meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .item-amount { font-weight: 600; font-size: 14.5px; white-space: nowrap; }
  .item-amount.pos { color: var(--ok); }
  .item-amount.neg { color: #FC8181; }
  .del-btn { background: none; border: none; color: var(--ink-soft); font-size: 15px; cursor: pointer; padding: 2px 4px; }

  .progress-track { background: rgba(255, 255, 255, 0.05); border-radius: 99px; height: 6px; margin-top: 8px; overflow: hidden; }
  .progress-fill { background: var(--accent); height: 100%; border-radius: 99px; transition: width 0.3s ease; }
  .progress-fill.bad { background: var(--bad); }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
    display: flex; background: rgba(18, 22, 31, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--glass-border);
    padding-bottom: env(safe-area-inset-bottom, 6px); z-index: 30;
  }
  .tabbar button {
    flex: 1; background: none; border: none; color: var(--ink-soft); font-size: 11px;
    padding: 12px 4px 8px; cursor: pointer; font-weight: 500; transition: color 0.2s;
  }
  .tabbar button.active { color: var(--accent); font-weight: 600; }

  .empty { text-align: center; padding: 32px 16px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.5; }

  .fab {
    position: fixed; right: calc(50% - 240px + 20px); bottom: calc(72px + env(safe-area-inset-bottom, 0px));
    width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: #fff;
    border: none; font-size: 24px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4); cursor: pointer;
    display: flex; align-items: center; justify-content: center; z-index: 20;
  }
  @media (max-width: 520px) { .fab { right: 20px; } }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .modal {
    background: #1A202C;
    width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
    padding: 22px 18px 24px; max-height: 88vh; overflow-y: auto; border-top: 1px solid var(--glass-highlight);
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .modal h3 { margin: 0 0 14px; font-size: 17px; font-weight: 600; }
  label { display: block; font-size: 12px; color: var(--ink-soft); margin: 12px 0 5px; font-weight: 500; }
  input[type=text], input[type=number], input[type=date], select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--glass-border); border-radius: 10px;
    font-size: 15px; background: rgba(255, 255, 255, 0.04); color: var(--ink); outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  select { appearance: none; }
  .seg { display: flex; gap: 8px; margin-top: 5px; }
  .seg button {
    flex: 1; padding: 9px 4px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.04);
    border-radius: 8px; font-size: 12.5px; cursor: pointer; color: var(--ink-soft); font-weight: 500;
  }
  .seg button.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14.5px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--glass-border); color: var(--ink-soft); }
  .hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 5px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .two-col { display: flex; gap: 10px; }
  .two-col > div { flex: 1; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <p class="title" id="hdr-title">Mi Libro de Cuentas</p>
    <p class="sub" id="hdr-sub">Cargando…</p>
  </div>
  <main id="view-root"><div class="loading">Cargando tu libro…</div></main>
  <nav class="tabbar">
    <button data-tab="resumen" class="active">Resumen</button>
    <button data-tab="movimientos">Movimientos</button>
    <button data-tab="deudas">Créditos</button>
    <button data-tab="ajustes">Ajustes</button>
  </nav>
</div>
<div id="modal-root"></div>

<script>
const STORAGE_KEY = 'libro-cuentas-datos-v22';
let currentTab = 'resumen';
let data = null;
let showDetailsQ5 = false;
let showDetailsQ20 = false;
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function uid(p){ return p + Date.now().toString(36) + Math.floor(Math.random()*1000); }

function defaultData(){
  return {
    saldoAcumuladoAnterior: 0,
    config: {
      diasPago: [5, 20],
      moneda: 'COP'
    },
    ingresos: [],
    gastos: [
      { id: 'g_claro', monto: 39000, fecha: toISO(new Date()), nota: 'Plan Claro Movil', categoria: 'Servicios', quincenaPago: 20 }
    ],
    deudas: [
      {
        id: 'd_bdb',
        nombre: 'Banco de Bogotá (Libre Inv.)',
        tipo: 'revolvente',
        saldoInicial: 9516075,
        saldoActual: 9516075,
        tasaInteresMensual: 2.085,
        cuotaValor: 510757,
        cuotasTotales: 24,
        cuotasPagadas: 0,
        quincenaPago: 5,
        corteDia: 10,
        activo: true,
        fechaUltimaActualizacion: toISO(new Date()),
        historialPagos: []
      },
      {
        id: 'd_colsub',
        nombre: 'Colsubsidio (Avances/Cupo)',
        tipo: 'revolvente',
        saldoInicial: 1047102,
        saldoActual: 1047102,
        tasaInteresMensual: 2.16,
        cuotaValor: 84953,
        cuotasTotales: 24,
        cuotasPagadas: 0,
        quincenaPago: 20,
        corteDia: 16,
        activo: true,
        fechaUltimaActualizacion: toISO(new Date()),
        historialPagos: []
      },
      {
        id: 'd_rappi',
        nombre: 'RappiCard (Sin Intereses)',
        tipo: 'tarjeta',
        saldoInicial: 776918,
        saldoActual: 776918,
        cupoTotal: 1000000,
        tasaInteresMensual: 0,
        cuotaValor: 0,
        cuotasTotales: null,
        cuotasPagadas: 0,
        quincenaPago: 20,
        corteDia: 20,
        activo: true,
        fechaUltimaActualizacion: toISO(new Date()),
        historialPagos: []
      },
      {
        id: 'd_addi',
        nombre: 'Addi (Crédito e51993d8)',
        tipo: 'cuota_fija',
        saldoInicial: 200516,
        saldoActual: 139870,
        tasaInteresMensual: 0,
        cuotaValor: 69935,
        cuotasTotales: 2,
        cuotasPagadas: 0,
        quincenaPago: 20,
        corteDia: 16,
        activo: true,
        fechaUltimaActualizacion: toISO(new Date()),
        historialPagos: []
      },
      {
        id: 'd_watch',
        nombre: 'Mercado Libre Apple Watch',
        tipo: 'cuota_fija',
        saldoInicial: 1656679,
        saldoActual: 1656679,
        tasaInteresMensual: 0,
        cuotaValor: 138057,
        cuotasTotales: 12,
        cuotasPagadas: 0,
        quincenaPago: 20,
        corteDia: 20,
        activo: true,
        fechaUltimaActualizacion: toISO(new Date()),
        historialPagos: []
      },
      {
        id: 'd_moto',
        nombre: 'Seguro moto',
        tipo: 'cuota_fija',
        saldoInicial: 780000,
        saldoActual: 780000,
        tasaInteresMensual: 0,
        cuotaValor: 130000,
        cuotasTotales: 6,
        cuotasPagadas: 0,
        quincenaPago: 20,
        corteDia: 20,
        activo: true,
        fechaUltimaActualizacion: toISO(new Date()),
        historialPagos: []
      }
    ]
  };
}

function migrar(d){
  if(d.saldoAcumuladoAnterior === undefined) d.saldoAcumuladoAnterior = 0;
  if(!d.config.diasPago) d.config.diasPago = [5,20];
  if(d.deudas) {
    d.deudas.forEach(x => { 
      if(!x.tipo) x.tipo = 'cuota_fija'; 
      if(x.cuotasTotales === undefined) x.cuotasTotales = null;
      if(x.cuotasPagadas === undefined) x.cuotasPagadas = 0;
      if(!x.fechaUltimaActualizacion) x.fechaUltimaActualizacion = toISO(new Date());
    });
  }
  return d;
}

function calcularInteresDiarioAcumulado(){
  if(!data || !data.deudas) return;
  const hoy = midnight(new Date());
  let modificado = false;

  data.deudas.forEach(d => {
    if(!d.activo || !d.tasaInteresMensual || d.tasaInteresMensual <= 0 || d.saldoActual <= 0 || d.tipo === 'cuota_fija' || d.tipo === 'tarjeta') return;
    const fechaUlt = d.fechaUltimaActualizacion ? parseDate(d.fechaUltimaActualizacion) : hoy;
    const ultM = midnight(fechaUlt);
    
    const diffTime = hoy.getTime() - ultM.getTime();
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

    if(diffDays > 0) {
      const tasaDiaria = (Number(d.tasaInteresMensual) / 100) / 30;
      const interesAcumulado = d.saldoActual * tasaDiaria * diffDays;
      d.saldoActual = Math.round(d.saldoActual + interesAcumulado);
      d.fechaUltimaActualizacion = toISO(hoy);
      modificado = true;
    }
  });

  if(modificado) saveData();
}

function loadData(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    data = raw ? migrar(JSON.parse(raw)) : defaultData();
  } catch(e) {
    data = defaultData();
  }
  calcularInteresDiarioAcumulado();
  render();
}

function saveData(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) {
    console.error('No se pudo guardar localmente', e);
  }
}

function fmt(n){
  const val = Math.round(Number(n)||0);
  return new Intl.NumberFormat('es-CO', {
    style: 'currency',
    currency: data.config.moneda || 'COP',
    maximumFractionDigits: 0
  }).format(val);
}

function parseDate(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function diasPagoOrdenados(){
  return [...data.config.diasPago].sort((a,b) => a-b);
}

function getPeriodoForDia(pagaDia, hoy){
  const hoyM = midnight(hoy);
  let candidatos = [];
  for(let off = -1; off <= 1; off++){
    candidatos.push(new Date(hoyM.getFullYear(), hoyM.getMonth() + off, pagaDia));
  }
  candidatos.sort((a,b) => a - b);
  let fin = candidatos.find(c => c.getTime() >= hoyM.getTime()) || candidatos[0];
  const dias = diasPagoOrdenados();
  const otroDia = dias.find(d => d !== pagaDia) || 5;
  let prevPago = new Date(fin);
  if(pagaDia > otroDia){
    prevPago.setDate(otroDia);
  } else {
    prevPago.setMonth(prevPago.getMonth() - 1);
    prevPago.setDate(otroDia);
  }
  const inicio = new Date(prevPago); inicio.setDate(inicio.getDate()+1);
  return { pagaEl: pagaDia, inicio, fin, rango: rangoLabel(inicio, fin) };
}

function rangoLabel(inicio, fin){
  if(inicio.getMonth() === fin.getMonth()) return `${inicio.getDate()}–${fin.getDate()} ${MESES[fin.getMonth()]}`;
  return `${inicio.getDate()} ${MESES[inicio.getMonth()]} – ${fin.getDate()} ${MESES[fin.getMonth()]}`;
}

function enRango(iso, inicio, fin){ const d = parseDate(iso); return d >= inicio && d <= fin; }

// Sueldo neto exacto asignado a cada quincena
function ingresoAutomatico(periodo){
  if(periodo.pagaEl === 5){
    return 1390548; // Valor neto quincena del 5
  } else if(periodo.pagaEl === 20){
    return 1090548; // Valor neto quincena del 20
  }
  return 0;
}

function sumIngresosManuales(inicio, fin){
  return data.ingresos.filter(i => enRango(i.fecha, inicio, fin)).reduce((a,b) => a + Number(b.monto), 0);
}

function sumGastos(inicio, fin, periodo){
  return data.gastos.reduce((acc, g) => {
    if(g.quincenaPago) {
      return g.quincenaPago === periodo.pagaEl ? acc + Number(g.monto) : acc;
    }
    return enRango(g.fecha, inicio, fin) ? acc + Number(g.monto) : acc;
  }, 0);
}

function getCompromisosDeudasDetalle(periodo){
  let lista = [];
  data.deudas.filter(d => d.activo).forEach(d => {
    let cuotaProg = 0;
    if(d.tipo === 'tarjeta' && d.quincenaPago === periodo.pagaEl){
      cuotaProg = Number(d.saldoActual);
    } else if(d.quincenaPago === 'ambas'){
      cuotaProg = Number(d.cuotaValor) / 2;
    } else if(d.quincenaPago === periodo.pagaEl){
      cuotaProg = Number(d.cuotaValor);
    }

    if(cuotaProg > 0){
      let pagadoEnQ = 0;
      (d.historialPagos || []).forEach(p => {
        if(p.pago && enRango(p.fecha, periodo.inicio, periodo.fin)){
          pagadoEnQ += Number(p.pago);
        }
      });
      let egresoReal = Math.max(cuotaProg, pagadoEnQ);
      let pendiente = Math.max(0, cuotaProg - pagadoEnQ);
      lista.push({ nombre: d.nombre, cuotaProgramada: cuotaProg, pagado: pagadoEnQ, egresoReal: egresoReal, pendiente: pendiente, id: d.id });
    }
  });
  return lista;
}

function setTab(t){
  currentTab = t;
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  render();
}

function render(){
  const root = document.getElementById('view-root');
  const hoy = new Date();
  document.getElementById('hdr-sub').textContent = `${hoy.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'})}`;

  if(currentTab === 'resumen') root.innerHTML = viewResumen(hoy);
  else if(currentTab === 'movimientos') root.innerHTML = viewMovimientos();
  else if(currentTab === 'deudas') root.innerHTML = viewDeudas();
  else root.innerHTML = viewAjustes();

  let fab = document.querySelector('.fab');
  if(fab) fab.remove();
  if(currentTab === 'movimientos') addFab('+', () => openMovForm());
  else if(currentTab === 'deudas') addFab('+', () => openDeudaForm());
}

function addFab(icon, onclick){
  const btn = document.createElement('button');
  btn.className = 'fab'; btn.textContent = icon; btn.onclick = onclick;
  document.getElementById('app').appendChild(btn);
}

function toggleDetails(qNum){
  if(qNum === 5) showDetailsQ5 = !showDetailsQ5;
  if(qNum === 20) showDetailsQ20 = !showDetailsQ20;
  render();
}

function viewResumen(hoy){
  const q5 = getPeriodoForDia(5, hoy);
  const q20 = getPeriodoForDia(20, hoy);

  const ingQ5 = ingresoAutomatico(q5) + sumIngresosManuales(q5.inicio, q5.fin);
  const gasQ5 = sumGastos(q5.inicio, q5.fin, q5);
  const compQ5 = getCompromisosDeudasDetalle(q5);
  const totalCompQ5 = compQ5.reduce((a,b) => a + b.egresoReal, 0);
  const totalEgresosQ5 = gasQ5 + totalCompQ5;
  const libreQ5 = ingQ5 - totalEgresosQ5;
  const pctQ5 = ingQ5 > 0 ? Math.min(100, Math.round((totalEgresosQ5 / ingQ5) * 100)) : 0;

  const ingQ20 = ingresoAutomatico(q20) + sumIngresosManuales(q20.inicio, q20.fin);
  const gasQ20 = sumGastos(q20.inicio, q20.fin, q20);
  const compQ20 = getCompromisosDeudasDetalle(q20);
  const totalCompQ20 = compQ20.reduce((a,b) => a + b.egresoReal, 0);
  const totalEgresosQ20 = gasQ20 + totalCompQ20;
  const libreQ20 = ingQ20 - totalEgresosQ20;
  const pctQ20 = ingQ20 > 0 ? Math.min(100, Math.round((totalEgresosQ20 / ingQ20) * 100)) : 0;

  const ahorroBase = data.saldoAcumuladoAnterior || 0;
  const disponibleTotalReal = ahorroBase + libreQ5 + libreQ20;
  const deudaTotal = data.deudas.filter(d => d.activo).reduce((a,b) => a + Number(b.saldoActual), 0);

  let detailsQ5Html = '';
  if(showDetailsQ5){
    detailsQ5Html = `<div class="details-box"><strong>Desglose Créditos Quincena 5:</strong><br>`;
    compQ5.forEach(item => {
      let est = item.pagado >= item.cuotaProgramada ? ` <span style="color:var(--ok)">(Pagado)</span>` : '';
      detailsQ5Html += `<div class="row" style="padding:3px 0;"><span class="label">• ${escapeHtml(item.nombre)}${est}</span><span class="val">${fmt(item.egresoReal)}</span></div>`;
    });
    detailsQ5Html += `</div>`;
  }

  let detailsQ20Html = '';
  if(showDetailsQ20){
    detailsQ20Html = `<div class="details-box"><strong>Desglose Créditos Quincena 20:</strong><br>`;
    compQ20.forEach(item => {
      let est = item.pagado >= item.cuotaProgramada ? ` <span style="color:var(--ok)">(Pagado)</span>` : '';
      detailsQ20Html += `<div class="row" style="padding:3px 0;"><span class="label">• ${escapeHtml(item.nombre)}${est}</span><span class="val">${fmt(item.egresoReal)}</span></div>`;
    });
    detailsQ20Html += `</div>`;
  }

  let alertaAjusteHtml = '';
  if(libreQ20 < 0){
    alertaAjusteHtml = `
      <div class="card" style="border-color:rgba(237,137,54,0.3)">
        <h2 class="section-title" style="margin-top:0;color:var(--warn)">Reserva Requerida para Día 20</h2>
        <p class="hint" style="font-size:12.5px;color:var(--ink)">
          Te has pasado por <strong style="color:#FC8181">${fmt(Math.abs(libreQ20))}</strong> en la quincena del 20. Se sugiere apartar este valor de tu quincena del 5 o de tus fondos de reserva.
        </p>
      </div>`;
  }

  return `
    <div class="card hero-figure">
      <div class="hero-label">Disponible Total Real</div>
      <div class="hero-amount ok">${fmt(disponibleTotalReal)}</div>
      <div class="hero-note ok">Consolidado general de caja y dos quincenas</div>
    </div>

    ${alertaAjusteHtml}

    <div class="card">
      <h2 class="section-title" style="margin-top:0">Quincena del Día 5 (${q5.rango})</h2>
      <div class="row"><span class="label">Ingreso esperado</span><span class="val">${fmt(ingQ5)}</span></div>
      <div class="row clickable-row" onclick="toggleDetails(5)">
        <span class="label">Cuotas asignadas ▾</span>
        <span class="val neg">- ${fmt(totalCompQ5)}</span>
      </div>
      ${detailsQ5Html}
      <div class="row"><span class="label">Gastos diarios y servicios</span><span class="val neg">- ${fmt(gasQ5)}</span></div>
      <div class="row"><span class="label" style="font-weight:600;color:var(--ink)">Margen libre en quincena</span><span class="val" style="font-weight:700;color:${libreQ5<0?'var(--bad)':'var(--ok)'}">${fmt(libreQ5)}</span></div>
      
      <div class="hint" style="margin-top:8px;display:flex;justify-content:space-between">
        <span>Comprometido <strong>${pctQ5}%</strong></span>
      </div>
      <div class="progress-track"><div class="progress-fill ${pctQ5>100?'bad':''}" style="width:${pctQ5}%"></div></div>
    </div>

    <div class="card">
      <h2 class="section-title" style="margin-top:0">Quincena del Día 20 (${q20.rango})</h2>
      <div class="row"><span class="label">Ingreso esperado</span><span class="val">${fmt(ingQ20)}</span></div>
      <div class="row clickable-row" onclick="toggleDetails(20)">
        <span class="label">Cuotas asignadas ▾</span>
        <span class="val neg">- ${fmt(totalCompQ20)}</span>
      </div>
      ${detailsQ20Html}
      <div class="row"><span class="label">Gastos diarios y servicios</span><span class="val neg">- ${fmt(gasQ20)}</span></div>
      <div class="row"><span class="label" style="font-weight:600;color:var(--ink)">Margen libre en quincena</span><span class="val" style="font-weight:700;color:${libreQ20<0?'var(--bad)':'var(--ok)'}">${fmt(libreQ20)}</span></div>
      
      <div class="hint" style="margin-top:8px;display:flex;justify-content:space-between">
        <span>Comprometido <strong>${pctQ20}%</strong></span>
      </div>
      <div class="progress-track"><div class="progress-fill ${pctQ20>100?'bad':''}" style="width:${pctQ20}%"></div></div>
    </div>

    <div class="card">
      <div class="row"><span class="label">Fondo Acumulado (Caja)</span><span class="val" style="color:var(--ok)">+ ${fmt(ahorroBase)}</span></div>
      <div class="row"><span class="label">Deuda global acumulada</span><span class="val neg">${fmt(deudaTotal)}</span></div>
    </div>
  `;
}

function viewMovimientos(){
  const todos = [
    ...data.ingresos.map(i => ({...i, tipo:'ingreso'})),
    ...data.gastos.map(g => ({...g, tipo:'gasto'}))
  ].sort((a,b) => b.fecha.localeCompare(a.fecha));

  if(todos.length === 0){
    return `<div class="empty">No hay gastos o ingresos adicionales.<br>Tus gastos automáticos como Claro están en la quincena.<br>Toca "+" para registrar un nuevo movimiento.</div>`;
  }
  return `<h2 class="section-title">Movimientos y Gastos</h2>` + todos.map(m => `
    <div class="item">
      <div class="item-top">
        <div>
          <div class="item-name">${escapeHtml(m.nota || (m.tipo==='ingreso'?'Ingreso':'Gasto'))}</div>
          <div class="item-meta">${m.fecha} · ${m.tipo==='gasto' ? escapeHtml(m.categoria||'General') : 'Ingreso extra'} ${m.quincenaPago? '· Fijo Quincena '+m.quincenaPago : ''}</div>
        </div>
        <div style="text-align:right">
          <div class="item-amount ${m.tipo==='ingreso'?'pos':'neg'}">${m.tipo==='ingreso'?'+':'-'} ${fmt(m.monto)}</div>
          <button class="del-btn" onclick="eliminarMov('${m.tipo}','${m.id}')">✕</button>
        </div>
      </div>
    </div>
  `).join('');
}

function viewDeudas(){
  if(data.deudas.length === 0){
    return `<div class="empty">No tienes obligaciones registradas.<br>Toca "+" para agregar una nueva.</div>`;
  }
  return `<h2 class="section-title">Estado de Créditos y Pasivos</h2>` + data.deudas.map(d => {
    const totalPagado = (d.historialPagos || []).reduce((a,b) => a + (Number(b.pago)||0), 0);
    const baseInicial = Math.max(d.saldoInicial || 0, d.saldoActual + totalPagado);
    const pct = baseInicial > 0 ? Math.min(100, Math.round((totalPagado / baseInicial) * 100)) : 0;

    let tipoLabel = 'Cuota Fija';
    if(d.tipo === 'tarjeta') tipoLabel = `Tarjeta Crédito · Sin Intereses (Corte ${d.corteDia || 20})`;
    else if(d.tipo === 'revolvente') tipoLabel = `Interés variable (${d.tasaInteresMensual}% MV)`;

    const tasaDiaria = (Number(d.tasaInteresMensual) / 100) / 30;
    const interesDiario = Math.round(d.saldoActual * tasaDiaria);

    let cuotasDetalle = '';
    if(d.cuotasTotales && d.cuotasTotales > 0){
      const pagadas = d.cuotasPagadas || 0;
      const restantes = Math.max(0, d.cuotasTotales - pagadas);
      cuotasDetalle = `<div class="row"><span class="label">Cuotas restantes</span><span class="val">${restantes} de ${d.cuotasTotales} (${fmt(d.cuotaValor)}/mes)</span></div>`;
    }

    return `
    <div class="item">
      <div class="item-top">
        <div>
          <div class="item-name">${escapeHtml(d.nombre)}</div>
          <div class="item-meta">${tipoLabel} · Paga el ${d.quincenaPago==='ambas'?'5 y 20':d.quincenaPago}</div>
        </div>
        <div>
          <button class="del-btn" style="font-size:12px;margin-right:8px;color:var(--accent)" onclick="openDeudaForm('${d.id}')">Editar</button>
          <button class="del-btn" onclick="eliminarDeuda('${d.id}')">✕</button>
        </div>
      </div>
      <div class="row"><span class="label">Saldo pendiente actual</span><span class="val neg">${fmt(d.saldoActual)}</span></div>
      ${d.tasaInteresMensual > 0 ? `<div class="row"><span class="label">Interés diario acumulado</span><span class="val neg">+ ${fmt(interesDiario)}/día</span></div>` : ''}
      ${d.tipo !== 'tarjeta' ? `<div class="row"><span class="label">Cuota mensual programada</span><span class="val">${fmt(d.cuotaValor)}</span></div>` : ''}
      ${cuotasDetalle}
      <div class="hint">${fmt(totalPagado)} abonados de ${fmt(baseInicial)} (${pct}% amortizado)</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="modal-actions" style="margin-top:12px">
        ${d.tipo === 'tarjeta' ? `<button class="btn ghost" onclick="agregarCompra('${d.id}')">Cargar Compra</button>` : ''}
        <button class="btn primary" onclick="registrarPago('${d.id}')">Registrar Pago</button>
      </div>
    </div>`;
  }).join('');
}

function viewAjustes(){
  const dias = diasPagoOrdenados();
  return `
    <h2 class="section-title">Fechas de Corte / Pago</h2>
    <div class="card">
      <div class="two-col">
        <div><label>Pago 1 (Día)</label><input type="number" id="a-dia1" value="${dias[0]}" min="1" max="28"></div>
        <div><label>Pago 2 (Día)</label><input type="number" id="a-dia2" value="${dias[1]}" min="1" max="28"></div>
      </div>
    </div>

    <h2 class="section-title">Saldo Base Acumulado Inicial</h2>
    <div class="card">
      <label>Dinero Real que Tienes Hoy en Banco/Efectivo ($)</label>
      <input type="number" id="a-caja" value="${data.saldoAcumuladoAnterior||0}" placeholder="0">
      <div class="modal-actions" style="margin-top:10px">
        <button class="btn primary" onclick="guardarAjustes()">Guardar Caja</button>
      </div>
    </div>

    <div class="card">
      <div class="modal-actions">
        <button class="btn ghost" onclick="borrarTodo()">Restablecer Todo</button>
      </div>
    </div>
  `;
}

function guardarAjustes(){
  const d1 = parseInt(document.getElementById('a-dia1').value, 10);
  const d2 = parseInt(document.getElementById('a-dia2').value, 10);
  if(d1 >= 1 && d1 <= 28 && d2 >= 1 && d2 <= 28 && d1 !== d2) data.config.diasPago = [d1, d2];
  data.saldoAcumuladoAnterior = parseFloat(document.getElementById('a-caja').value) || 0;

  saveData();
  render();
}

function borrarTodo(){
  if(confirm('¿Restablecer y borrar todos los datos locales?')){
    data = defaultData();
    saveData();
    render();
  }
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Movimientos con Recurrencia */
function openMovForm(){
  const dias = diasPagoOrdenados();
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>Registrar Movimiento</h3>
        <div class="seg" id="mov-tipo-seg">
          <button class="sel" data-v="gasto" onclick="setMovTipo('gasto')">Gasto</button>
          <button data-v="ingreso" onclick="setMovTipo('ingreso')">Ingreso Extra</button>
        </div>
        <label>Monto ($)</label>
        <input type="number" id="mov-monto" placeholder="0">
        
        <div id="mov-fijo-wrap">
          <label>Frecuencia / Recurrencia</label>
          <div class="seg" id="mov-fijo-seg">
            <button class="sel" data-v="fecha" onclick="setRecurrenciaTipo('fecha')">Ocasional</button>
            <button data-v="${dias[0]}" onclick="setRecurrenciaTipo(${dias[0]})">Fijo Q.${dias[0]}</button>
            <button data-v="${dias[1]}" onclick="setRecurrenciaTipo(${dias[1]})">Fijo Q.${dias[1]}</button>
          </div>
        </div>

        <div id="mov-fecha-wrap">
          <label>Fecha de Registro</label>
          <input type="date" id="mov-fecha" value="${toISO(new Date())}">
        </div>

        <div id="mov-categoria-wrap">
          <label>Categoría</label>
          <input type="text" id="mov-categoria" placeholder="Ej: Servicios, Mercado, Suscripción">
        </div>
        <label>Descripción / Nombre</label>
        <input type="text" id="mov-nota" placeholder="Ej: Plan Claro, Netflix, Gimnasio...">
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn primary" onclick="guardarMov()">Guardar</button>
        </div>
      </div>
    </div>`;
  window._movTipo = 'gasto';
  window._movRecurrencia = 'fecha';
}

function setMovTipo(t){
  window._movTipo = t;
  document.querySelectorAll('#mov-tipo-seg button').forEach(b => b.classList.toggle('sel', b.dataset.v === t));
  document.getElementById('mov-categoria-wrap').style.display = t === 'gasto' ? 'block' : 'none';
  document.getElementById('mov-fijo-wrap').style.display = t === 'gasto' ? 'block' : 'none';
}

function setRecurrenciaTipo(r){
  window._movRecurrencia = r;
  document.querySelectorAll('#mov-fijo-seg button').forEach(b => b.classList.toggle('sel', String(b.dataset.v) === String(r)));
  document.getElementById('mov-fecha-wrap').style.display = r === 'fecha' ? 'block' : 'none';
}

function guardarMov(){
  const monto = parseFloat(document.getElementById('mov-monto').value);
  const fecha = document.getElementById('mov-fecha').value || toISO(new Date());
  const nota = document.getElementById('mov-nota').value;
  if(!monto || monto <= 0){ alert('Ingresa un monto válido.'); return; }

  if(window._movTipo === 'ingreso') {
    data.ingresos.push({ id: uid('i'), monto, fecha, nota });
  } else {
    const categoria = document.getElementById('mov-categoria').value || 'General';
    const qPago = window._movRecurrencia !== 'fecha' ? parseInt(window._movRecurrencia, 10) : null;
    data.gastos.push({ id: uid('g'), monto, fecha, nota, categoria, quincenaPago: qPago });
  }
  saveData(); closeModal(); render();
}

function eliminarMov(tipo, id){
  if(tipo === 'ingreso') data.ingresos = data.ingresos.filter(i => i.id !== id);
  else data.gastos = data.gastos.filter(g => g.id !== id);
  saveData(); render();
}

/* Deudas Formulario y Edición */
function openDeudaForm(editId = null){
  const dias = diasPagoOrdenados();
  let d = editId ? data.deudas.find(x => x.id === editId) : null;

  const nombreVal = d ? d.nombre : '';
  const tipoVal = d ? d.tipo : 'cuota_fija';
  const saldoVal = d ? d.saldoActual : '';
  const cuotasTotalesVal = d ? (d.cuotasTotales || '') : '';
  const interesVal = d ? d.tasaInteresMensual : '';
  const qVal = d ? d.quincenaPago : dias[0];

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${d ? 'Editar' : 'Nuevo'} Crédito o Compra</h3>
        <label>Nombre de la Entidad / Compra</label>
        <input type="text" id="d-nombre" value="${escapeHtml(nombreVal)}" placeholder="Ej: Apple Watch, Seguro Moto">
        <label>Tipo de Crédito</label>
        <div class="seg" id="d-tipo-seg">
          <button class="${tipoVal==='cuota_fija'?'sel':''}" data-v="cuota_fija" onclick="setDeudaTipo('cuota_fija')">Cuota Fija</button>
          <button class="${tipoVal==='revolvente'?'sel':''}" data-v="revolvente" onclick="setDeudaTipo('revolvente')">Interés Variable</button>
          <button class="${tipoVal==='tarjeta'?'sel':''}" data-v="tarjeta" onclick="setDeudaTipo('tarjeta')">Tarjeta Crédito</button>
        </div>
        <label>Saldo Pendiente ($)</label>
        <input type="number" id="d-saldo" value="${saldoVal}" placeholder="0">
        
        <div id="d-cuotas-totales-wrap" style="${tipoVal==='cuota_fija'?'block':'none'}">
          <label>Número de Cuotas Totales</label>
          <input type="number" id="d-cuotas-totales" value="${cuotasTotalesVal}" placeholder="Ej: 12, 6, 24">
        </div>

        <div id="d-interes-wrap" style="${tipoVal==='revolvente'?'block':'none'}">
          <label>Interés Mensual (% MV)</label>
          <input type="number" step="0.01" id="d-interes" value="${interesVal}" placeholder="Ej: 2.1">
        </div>

        <label>Quincena de Pago Habitual</label>
        <div class="seg" id="d-quincena-seg">
          <button class="${qVal===dias[0]?'sel':''}" data-v="${dias[0]}" onclick="setDeudaQuincena(${dias[0]})">Día ${dias[0]}</button>
          <button class="${qVal===dias[1]?'sel':''}" data-v="${dias[1]}" onclick="setDeudaQuincena(${dias[1]})">Día ${dias[1]}</button>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn primary" onclick="guardarDeuda('${editId||''}')">Guardar</button>
        </div>
      </div>
    </div>`;
  window._deudaTipo = tipoVal;
  window._deudaQuincena = qVal;
}

function setDeudaTipo(t){
  window._deudaTipo = t;
  document.querySelectorAll('#d-tipo-seg button').forEach(b => b.classList.toggle('sel', b.dataset.v === t));
  document.getElementById('d-interes-wrap').style.display = t === 'revolvente' ? 'block' : 'none';
  document.getElementById('d-cuotas-totales-wrap').style.display = t === 'cuota_fija' ? 'block' : 'none';
}

function setDeudaQuincena(q){
  window._deudaQuincena = q;
  document.querySelectorAll('#d-quincena-seg button').forEach(b => b.classList.toggle('sel', String(b.dataset.v) === String(q)));
}

function guardarDeuda(editId){
  const nombre = document.getElementById('d-nombre').value.trim();
  const saldo = parseFloat(document.getElementById('d-saldo').value);
  const tipo = window._deudaTipo;
  const cuotasTotales = parseInt(document.getElementById('d-cuotas-totales').value, 10) || null;
  const interes = (tipo === 'revolvente') ? (parseFloat(document.getElementById('d-interes').value)||0) : 0;

  if(!nombre || isNaN(saldo) || (tipo === 'cuota_fija' && (!cuotasTotales || cuotasTotales <= 0))){
    alert('Ingresa nombre, saldo y número de cuotas válidos.'); return;
  }

  const cuota = tipo === 'cuota_fija' ? Math.round(saldo / cuotasTotales) : 0;

  if(editId){
    let d = data.deudas.find(x => x.id === editId);
    if(d){
      d.nombre = nombre; d.tipo = tipo; d.saldoActual = saldo;
      d.cuotaValor = cuota; d.cuotasTotales = cuotasTotales;
      d.tasaInteresMensual = interes; d.quincenaPago = window._deudaQuincena;
    }
  } else {
    data.deudas.push({
      id: uid('d'), nombre, tipo, saldoInicial: saldo, saldoActual: saldo,
      tasaInteresMensual: interes, cuotaValor: cuota, cuotasTotales: cuotasTotales, cuotasPagadas: 0,
      quincenaPago: window._deudaQuincena, activo: true, fechaUltimaActualizacion: toISO(new Date()), historialPagos: []
    });
  }

  saveData(); closeModal(); render();
}

function eliminarDeuda(id){
  if(confirm('¿Eliminar esta obligación financiera?')){
    data.deudas = data.deudas.filter(d => d.id !== id);
    saveData(); render();
  }
}

function registrarPago(id){
  const d = data.deudas.find(x => x.id === id); if(!d) return;
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>Abonar / Pagar · ${escapeHtml(d.nombre)}</h3>
        <div class="row"><span class="label">Saldo actual pendiente</span><span class="val">${fmt(d.saldoActual)}</span></div>
        <label>Monto a Pagar ($)</label>
        <input type="number" id="pago-monto" value="${d.tipo==='tarjeta' ? d.saldoActual : d.cuotaValor}">
        <label>Fecha de Pago</label>
        <input type="date" id="pago-fecha" value="${toISO(new Date())}">
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn primary" onclick="confirmarPago('${id}')">Aplicar Pago</button>
        </div>
      </div>
    </div>`;
}

function confirmarPago(id){
  const d = data.deudas.find(x => x.id === id);
  const pago = parseFloat(document.getElementById('pago-monto').value);
  const fecha = document.getElementById('pago-fecha').value;
  if(isNaN(pago) || pago <= 0){ alert('Ingresa un monto válido.'); return; }

  d.saldoActual = Math.max(0, d.saldoActual - pago);
  d.cuotasPagadas = (d.cuotasPagadas||0) + 1;

  d.fechaUltimaActualizacion = toISO(new Date());
  d.historialPagos.push({ fecha, pago, saldoResultante: d.saldoActual });
  saveData(); closeModal(); render();
}

function agregarCompra(id){
  const d = data.deudas.find(x => x.id === id); if(!d) return;
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>Nueva Compra · ${escapeHtml(d.nombre)}</h3>
        <label>Monto de la Compra</label>
        <input type="number" id="compra-monto" placeholder="0">
        <label>Fecha</label>
        <input type="date" id="compra-fecha" value="${toISO(new Date())}">
        <label>Detalle / Establecimiento</label>
        <input type="text" id="compra-nota" placeholder="Ej: Supermercado, Gasolina...">
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn primary" onclick="confirmarCompra('${id}')">Cargar a Tarjeta</button>
        </div>
      </div>
    </div>`;
}

function confirmarCompra(id){
  const d = data.deudas.find(x => x.id === id);
  const monto = parseFloat(document.getElementById('compra-monto').value);
  const fecha = document.getElementById('compra-fecha').value;
  if(!monto || monto <= 0){ alert('Ingresa un monto válido.'); return; }
  d.saldoActual += monto;
  d.fechaUltimaActualizacion = toISO(new Date());
  d.historialPagos.push({ fecha, compra: true, monto });
  saveData(); closeModal(); render();
}

function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }
document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
loadData();
</script>
</body>
</html>

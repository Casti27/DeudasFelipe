function migrarSaldoBaseCuotas(deuda){
  const historial = Array.isArray(deuda.historialPagos) ? deuda.historialPagos : [];
  const retirosEnCuotas = historial.filter(movimiento =>
    movimiento.tipo === 'retiro' && Number.isInteger(Number(movimiento.cuotasTotales)) && Number(movimiento.cuotasTotales) > 0
  );
  if(deuda.tipo !== 'tarjeta' || !retirosEnCuotas.length || deuda.saldoBaseCuotas !== undefined) return {};

  const primerRetiro = [...retirosEnCuotas].sort((a, b) => String(a.fecha || '').localeCompare(String(b.fecha || '')))[0];
  if(!primerRetiro.fecha) return {};
  const pagosPosteriores = historial.reduce((total, movimiento) => {
    if(String(movimiento.fecha || '') < primerRetiro.fecha || !(movimiento.tipo === 'pago' || movimiento.pago > 0)) return total;
    return total + (Number(movimiento.monto || movimiento.pago) || 0);
  }, 0);
  const retirosRegistrados = retirosEnCuotas.reduce((total, movimiento) => total + (Number(movimiento.monto) || 0), 0);
  return {
    saldoBaseCuotas: Math.max(0, (Number(deuda.saldoActual) || 0) + pagosPosteriores - retirosRegistrados),
    fechaInicioBaseCuotas: primerRetiro.fecha
  };
}

function normalizeData(raw){
  const base = initialBaseData();
  const next = raw && typeof raw === 'object' ? raw : {};
  return {
    ...base,
    ...next,
    config: { ...base.config, ...(next.config || {}) },
    ingresos: Array.isArray(next.ingresos) ? next.ingresos : base.ingresos,
    gastos: (Array.isArray(next.gastos) ? next.gastos : base.gastos).filter(g => g.id !== 'g_plan_datos'),
    deudas: (Array.isArray(next.deudas) ? next.deudas : base.deudas).map(deuda => {
      const normalizada = {
        ...deuda,
        historialPagos: Array.isArray(deuda.historialPagos) ? deuda.historialPagos : []
      };
      const deudaConBase = { ...normalizada, ...migrarSaldoBaseCuotas(normalizada) };
      if(deudaConBase.id === 'd_rappi'){
        const retirosEnCuotas = deudaConBase.historialPagos.filter(movimiento =>
          movimiento.tipo === 'retiro' && Number.isInteger(Number(movimiento.cuotasTotales)) && Number(movimiento.cuotasTotales) > 0 && movimiento.fecha
        );
        if(retirosEnCuotas.length){
          const primerRetiro = retirosEnCuotas.sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)))[0];
          deudaConBase.saldoBaseCuotas = 567463;
          deudaConBase.fechaInicioBaseCuotas = primerRetiro.fecha;
        }
      }
      return deudaConBase;
    }),
    saldoAcumuladoAnterior: Number(next.saldoAcumuladoAnterior || 0),
    migrations: Array.isArray(next.migrations) ? next.migrations : []
  };
}

function loadData(){
  try {
    const local = localStorage.getItem(APP_STORAGE_KEY);
    data = normalizeData(local ? JSON.parse(local) : initialBaseData());
  } catch(e){
    data = initialBaseData();
  }
  calcularInteresDiarioAcumulado();
  saveData();
  render();
}

function saveData(){
  try {
    localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(data));
  } catch(e) {
    console.error('Error al guardar datos', e);
  }
}

function calcularInteresDiarioAcumulado(){
  if(!data || !data.deudas) return;
  const hoy = midnight(new Date());
  let modificado = false;

  data.deudas.forEach(d => {
    if(!d.activo || !d.tasaInteresMensual || d.tasaInteresMensual <= 0 || d.saldoActual <= 0) return;
    const fechaUlt = d.fechaUltimaActualizacion ? parseDate(d.fechaUltimaActualizacion) : hoy;
    const ultM = midnight(fechaUlt);
    const diffTime = hoy.getTime() - ultM.getTime();
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

    if(diffDays > 0) {
      const tasaDiaria = Math.pow(1 + Number(d.tasaInteresMensual) / 100, 1 / 30) - 1;
      d.saldoActual = Math.round(Number(d.saldoActual) * Math.pow(1 + tasaDiaria, diffDays));
      d.fechaUltimaActualizacion = toISO(hoy);
      modificado = true;
    }
  });

  if(modificado) saveData();
}

function fmt(n){
  const val = Math.round(Number(n)||0);
  return new Intl.NumberFormat('es-CO', {
    style: 'currency',
    currency: data.config.moneda || 'COP',
    maximumFractionDigits: 0
  }).format(val);
}

function parseDate(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function diasPagoOrdenados(){
  return [...data.config.diasPago].sort((a,b) => a-b);
}

/* DÍA DE GRACIA INCLUIDO PARA DÍAS 21 Y 6 */
function getQuincenasOrdenadas(hoy){
  const hoyM = midnight(hoy);
  const diaMes = hoyM.getDate();
  const mes = hoyM.getMonth();
  const anio = hoyM.getFullYear();

  // Si hoy es día 21 o posterior (hasta el próximo 5), la quincena actual mostrada es la del 20 (incluye el 21 como día de gracia)
  if (diaMes >= 6 && diaMes <= 21) {
    return {
      q1: { pagaEl: 20, inicio: new Date(anio, mes, 6), fin: new Date(anio, mes, 21), rango: `6–21 ${MESES[mes]}` },
      q2: { pagaEl: 5, inicio: new Date(anio, mes, 22), fin: new Date(anio, mes + 1, 5), rango: `22 ${MESES[mes]} – 5 ${MESES[(mes + 1) % 12]}` }
    };
  } else {
    // Si estamos entre el día 22 y el 6 del siguiente mes (incluye el 6 como día de gracia)
    const mesInicio = diaMes >= 22 ? mes : mes - 1;
    return {
      q1: { pagaEl: 5, inicio: new Date(anio, mesInicio, 21), fin: new Date(anio, mesInicio + 1, 6), rango: `21 ${MESES[(mesInicio + 12) % 12]} – 6 ${MESES[(mesInicio + 1) % 12]}` },
      q2: { pagaEl: 20, inicio: new Date(anio, mesInicio + 1, 7), fin: new Date(anio, mesInicio + 1, 20), rango: `7–20 ${MESES[(mesInicio + 1) % 12]}` }
    };
  }
}

function enRango(iso, inicio, fin){ const d = parseDate(iso); return d >= inicio && d <= fin; }

function cuotasTarjetaParaPeriodo(deuda, periodo){
  const mesPago = periodo.fin.getFullYear() * 12 + periodo.fin.getMonth();
  return deuda.historialPagos.reduce((total, movimiento) => {
    const cuotas = Number(movimiento.cuotasTotales);
    if(movimiento.tipo !== 'retiro' || !Number.isInteger(cuotas) || cuotas < 1) return total;

    const fechaMovimiento = movimiento.fecha ? parseDate(movimiento.fecha) : null;
    if(!movimiento.fechaPrimeraCuota && !fechaMovimiento) return total;
    const primeraCuota = movimiento.fechaPrimeraCuota
      ? parseDate(movimiento.fechaPrimeraCuota)
      : new Date(fechaMovimiento.getFullYear(), fechaMovimiento.getMonth() + 1, 1);
    const indiceCuota = mesPago - (primeraCuota.getFullYear() * 12 + primeraCuota.getMonth());
    if(indiceCuota < 0 || indiceCuota >= cuotas) return total;

    const monto = Number(movimiento.monto) || 0;
    const cuotaBase = Math.floor(monto / cuotas);
    const valorCuota = indiceCuota === cuotas - 1 ? monto - cuotaBase * (cuotas - 1) : cuotaBase;
    return total + valorCuota;
  }, 0);
}

function saldoBaseTarjetaParaPeriodo(deuda, periodo){
  const saldoBase = Number(deuda.saldoBaseCuotas) || 0;
  const fechaInicio = deuda.fechaInicioBaseCuotas;
  if(saldoBase <= 0 || !fechaInicio) return 0;
  const pagosAnteriores = deuda.historialPagos.reduce((total, movimiento) => {
    if(!movimiento.fecha || movimiento.fecha < fechaInicio || parseDate(movimiento.fecha) >= periodo.inicio ||
      !(movimiento.tipo === 'pago' || movimiento.pago > 0)) return total;
    return total + (Number(movimiento.monto || movimiento.pago) || 0);
  }, 0);
  return Math.max(0, saldoBase - pagosAnteriores);
}

function getPagosQuincena(periodo){
  const detalles = [];
  data.deudas.filter(deuda => deuda.activo && Number(deuda.saldoActual) > 0).forEach(deuda => {
    const pagoDia = Number(periodo.pagaEl);
    const correspondeQuincena = deuda.quincenaPago === 'ambas' || Number(deuda.quincenaPago) === pagoDia;
    const retirosEnCuotas = deuda.tipo === 'tarjeta'
      ? deuda.historialPagos.filter(m => m.tipo === 'retiro' && Number.isInteger(Number(m.cuotasTotales)) && Number(m.cuotasTotales) > 0)
      : [];

    if(retirosEnCuotas.length){
      if(!correspondeQuincena) return;
      const cuotaMes = cuotasTarjetaParaPeriodo(deuda, periodo);
      const saldoBase = saldoBaseTarjetaParaPeriodo(deuda, periodo);
      if(cuotaMes <= 0 && saldoBase <= 0) return;
      const pagosDelPeriodo = deuda.historialPagos.reduce((total, movimiento) => {
        if(!movimiento.fecha || movimiento.fecha < (deuda.fechaInicioBaseCuotas || '') ||
          !(movimiento.tipo === 'pago' || movimiento.pago > 0) ||
          !enRango(movimiento.fecha, periodo.inicio, periodo.fin)) return total;
        return total + (Number(movimiento.monto || movimiento.pago) || 0);
      }, 0);
      const montoProgramado = saldoBase + cuotaMes;
      const montoPagado = Math.min(montoProgramado, pagosDelPeriodo);
      detalles.push({
        id: deuda.id,
        nombre: `${deuda.nombre} · saldo anterior y cuotas del mes`,
        cuota: montoProgramado,
        pagado: montoPagado >= montoProgramado,
        montoPagado,
        pendiente: Math.max(0, montoProgramado - montoPagado),
        tarjeta: true,
        gasto: false
      });
      return;
    }

    const pagoAsignado = deuda.tipo === 'tarjeta' && correspondeQuincena
      ? Number(deuda.saldoActual) || 0
      : deuda.quincenaPago === 'ambas'
        ? Number(deuda.cuotaValor || 0) / 2
        : Number(deuda.quincenaPago) === pagoDia ? Number(deuda.cuotaValor || 0) : 0;
    if(pagoAsignado <= 0) return;
    
    const pagado = (deuda.historialPagos || []).some(m => {
      if (!m.fecha) return false;
      const esPago = (m.tipo === 'pago' || m.pago > 0);
      return esPago && enRango(m.fecha, periodo.inicio, periodo.fin);
    });

    detalles.push({
      id: deuda.id,
      nombre: deuda.nombre,
      cuota: pagoAsignado,
      pagado: pagado,
      montoPagado: pagado ? pagoAsignado : 0,
      pendiente: pagado ? 0 : pagoAsignado,
      tarjeta: deuda.tipo === 'tarjeta',
      gasto: false
    });
  });

  data.gastos.filter(gasto => Number(gasto.quincenaPago) === Number(periodo.pagaEl)).forEach(gasto => {
    const monto = Number(gasto.monto) || 0;
    if(monto <= 0) return;
    detalles.push({
      id: gasto.id,
      nombre: gasto.nota || gasto.categoria || 'Gasto fijo',
      cuota: monto,
      pagado: false,
      montoPagado: 0,
      pendiente: monto,
      tarjeta: false,
      gasto: true
    });
  });

  return {
    detalles,
    total: detalles.reduce((total, detalle) => total + detalle.cuota, 0),
    pagado: detalles.reduce((total, detalle) => total + detalle.montoPagado, 0),
    pendiente: detalles.reduce((total, detalle) => total + detalle.pendiente, 0)
  };
}

function interesDiario(deuda){
  const tasa = Number(deuda.tasaInteresMensual) || 0;
  if(tasa <= 0) return 0;
  const diaria = Math.pow(1 + tasa / 100, 1 / 30) - 1;
  return Math.round((Number(deuda.saldoActual) || 0) * diaria);
}

function mesesParaPagar(deuda){
  const saldo = Number(deuda.saldoActual) || 0;
  const cuota = Number(deuda.cuotaValor) || 0;
  const tasa = (Number(deuda.tasaInteresMensual) || 0) / 100;
  if(saldo <= 0) return 0;
  if(cuota <= 0) return null;
  if(tasa === 0) return Math.ceil(saldo / cuota);
  if(cuota <= saldo * tasa) return null;
  return Math.ceil(-Math.log(1 - tasa * saldo / cuota) / Math.log(1 + tasa));
}

function plazoLabel(deuda){
  const meses = mesesParaPagar(deuda);
  if(meses === 0) return 'Pagado';
  if(meses === null || !Number.isFinite(meses)) return 'Cuota insuficiente';
  if(meses < 12) return `${meses} ${meses === 1 ? 'mes' : 'meses'}`;
  const anios = Math.floor(meses / 12);
  const restantes = meses % 12;
  return `${anios} ${anios === 1 ? 'año' : 'años'}${restantes ? `, ${restantes}${restantes === 1 ? 'mes' : 'meses'}` : ''}`;
}

function fechaLabel(iso){
  if(!iso) return '';
  return parseDate(iso).toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' });
}

function renderDebtCard(deuda){

  const meses = mesesParaPagar(deuda);
  const progreso = meses === 0 ? 100 : (Number(deuda.saldoInicial) > 0 ? Math.min(100, Math.max(0, Math.round((1 - deuda.saldoActual / deuda.saldoInicial) * 100))) : 0);
  const historialHtml = openDeudaHistorialId === deuda.id
    ? `<div class="details-box">
        <div class="details-title">Actividad del crédito</div>
        ${historial.length ? historial.map(mov => {
          const tipo = mov.tipo || (mov.pago ? 'pago' : (mov.compra ? 'compra' : 'retiro'));
          const pago = tipo === 'pago';
          const valor = Number(mov.monto || mov.pago) || 0;
          const detalleCuotas = Number.isInteger(Number(mov.cuotasTotales)) && Number(mov.cuotasTotales) > 0
            ? ` · ${mov.cuotasTotales} cuotas`
            : '';
          const detalle = `${detalleCuotas}${mov.nota ? ` · ${escapeHtml(mov.nota)}` : ''}`;
          const titulo = pago ? 'Abono realizado' : (tipo === 'compra' ? 'Compra con crédito' : 'Nuevo retiro');
          return `<div class="txn-row">
            <div><div class="txn-desc">${titulo}</div><div class="txn-meta">${fechaLabel(mov.fecha)}${detalle}</div></div>
            <div class="txn-value ${pago ? 'down' : 'up'}">${pago ? '−' : '+'} ${fmt(valor)}</div>
          </div>`;
        }).join('') : '<div class="hint">Todavía no hay movimientos registrados.</div>'}
      </div>`
    : '';
  const tipoIcono = deuda.tipo === 'tarjeta' ? '▣' : (deuda.tipo === 'cuota_fija' ? '◷' : '↗');

  return `<article class="item">
    <div class="item-top">
      <div class="credit-title-wrap">
        <div class="credit-icon" aria-hidden="true">${tipoIcono}</div>
        <div>
          <div class="item-name">${escapeHtml(deuda.nombre)}</div>
          <div class="item-meta">${deuda.tipo === 'tarjeta' ? 'Tarjeta de crédito' : deuda.tipo === 'cuota_fija' ? 'Crédito de cuota fija' : 'Crédito rotativo'}</div>
        </div>
      </div>
      <button class="icon-btn" aria-label="Editar crédito" onclick="openDeudaForm('${deuda.id}')">Editar</button>
    </div>
    <div class="balance-label">Saldo pendiente</div>
    <div class="balance">${fmt(deuda.saldoActual)}</div>
    ${deuda.id === 'd_rappi' ? `<button class="btn ghost full" style="margin-top:10px" onclick="actualizarSaldoRappi()">Actualizar saldo</button>` : ''}
    <div class="credit-metrics">
      <div><div class="metric-label">Tasa mensual</div><div class="metric-value">${tasa.toFixed(2)}% MV</div></div>
      <div><div class="metric-label">Interés aprox. / día</div><div class="metric-value">${fmt(interesDiario(deuda))}</div></div>
      <div><div class="metric-label">Tiempo estimado</div><div class="metric-value">${plazoLabel(deuda)}</div></div>
    </div>
    <div class="row"><span class="label">Cuota mensual registrada</span><span class="val">${cuota ? fmt(cuota) : 'Sin definir'}</span></div>
    ${deuda.quincenaPago ? `<div class="row"><span class="label">Fecha habitual de pago</span><span class="val">Día ${deuda.quincenaPago === 'ambas' ? '5 y 20' : deuda.quincenaPago}</span></div>` : ''}
    <div class="progress-track"><div class="progress-fill" style="width:${progreso}%"></div></div>
    ${deuda.id === 'd_rappi' ? '' : `<button class="row clickable-row" style="width:100%;border:0;background:transparent;text-align:left" onclick="toggleDeudaHistorial('${deuda.id}')">
      <span class="label">${openDeudaHistorialId === deuda.id ? 'Ocultar' : 'Ver'} movimientos (${historial.length})</span><span class="val">⌄</span>
    </button>${historialHtml}`}
    <div class="actions">
      <button class="btn ghost" onclick="registrarMovimientoDeuda('${deuda.id}','retiro')">+ Registrar retiro</button>
      <button class="btn primary" onclick="registrarMovimientoDeuda('${deuda.id}','pago')">Registrar pago</button>
    </div>
  </article>`;
}

function viewResumen(){
  const activas = data.deudas.filter(deuda => deuda.activo && Number(deuda.saldoActual) > 0);
  const totalDeuda = activas.reduce((suma, deuda) => suma + Number(deuda.saldoActual || 0), 0);
  const interesMes = activas.reduce((suma, deuda) => suma + Number(deuda.saldoActual || 0) * (Number(deuda.tasaInteresMensual) || 0) / 100, 0);
  const interesDia = activas.reduce((suma, deuda) => suma + interesDiario(deuda), 0);
  const periodos = getQuincenasOrdenadas(new Date());
  const quincenas = [periodos.q1, periodos.q2].map(periodo => ({
    periodo,
    pagos: getPagosQuincena(periodo)

  return `<div class="card hero-card">
      <div class="hero-label">Saldo total pendiente</div>
      <div class="hero-amount">${fmt(totalDeuda)}</div>
      <div class="hero-note">${activas.length} ${activas.length === 1 ? 'crédito activo' : 'créditos activos'}</div>
    </div>
    <div class="stats-grid">
      <div class="card stat-card"><div class="stat-label">Interés mensual estimado</div><div class="stat-value">${fmt(interesMes)}</div></div>
      <div class="card stat-card"><div class="stat-label">Interés diario estimado</div><div class="stat-value">${fmt(interesDia)}</div></div>
    </div>
    <div class="section-head">
      <div><h2 class="section-title">Pagos por quincena</h2><div class="section-note">Cuotas de créditos y gastos fijos para estas fechas</div></div>
    </div>
    <div class="pay-period-grid">
      ${quincenas.map(({periodo, pagos}, index) => `<section class="pay-period-card ${index === 0 ? 'next' : ''}">
        <div class="pay-period-date">DÍA ${periodo.pagaEl} ·${periodo.rango}</div>
        <div class="pay-period-total">${fmt(pagos.pendiente)}</div>
        <div class="pay-period-caption">${pagos.pagado ? `${fmt(pagos.pagado)} abonados · ` : ''}pendientes de ${fmt(pagos.total)} programados</div>
        <div class="pay-period-lines">
          ${pagos.detalles.length ? pagos.detalles.map(detalle => {
            const esPagado = detalle.pagado;
            return `<div class="pay-period-line ${esPagado ? 'pagado' : ''}">
              <span>${escapeHtml(detalle.nombre)}${detalle.gasto ? ' · gasto fijo' : esPagado ? ' · pagado' : detalle.montoPagado ? ` · abonado ${fmt(detalle.montoPagado)}` : ''}</span>
              <strong>${fmt(detalle.cuota)}</strong>
            </div>`;
          }).join('') : '<div class="pay-period-line"><span>No hay cuotas configuradas para esta quincena</span><strong>$0</strong></div>'}
        </div>
      </section>`).join('')}
    </div>
    <div class="section-head">
      <div><h2 class="section-title">Tus créditos</h2><div class="section-note">Saldos actualizados automáticamente</div></div>
      <button class="btn ghost small" onclick="setTab('deudas')">Ver todos</button>
    </div>
    ${destacadas.length ? destacadas.map(renderDebtCard).join('') : '<div class="empty">Aún no tienes créditos activos.<br>Agrega uno para empezar a llevar el control.</div>'}
    <div class="summary-banner">El interés se estima diariamente usando la tasa mensual MV registrada. Las proyecciones dependen de que mantengas la cuota mensual indicada.</div>`;
}

function aplicarRespaldo(){
  const txt = document.getElementById('import-json').value.trim();
  if(!txt){ alert('Pega un texto de respaldo válido.'); return; }
  try {
    const parsed = JSON.parse(txt);
    if(parsed && parsed.deudas){
      data = normalizeData(parsed);
      saveData();
      closeModal();
      render();
      alert('¡Datos restaurados con éxito!');
    } else {
      alert('El formato del respaldo no es válido.');
    }
  } catch(e){
    alert('Error al leer el respaldo.');
  }
}

  if(confirm('¿Restablecer y borrar todos los datos locales?')){

}

        <input type="text" id="mov-categoria" placeholder="Servicios, Mercado, etc.">
        <label>Descripción</label>
        <input type="text" id="mov-nota" placeholder="Detalle del gasto...">
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn primary" onclick="guardarMov()">Guardar</button>
        </div>
      </div>
    </div>`;
}

function guardarMov(){
  const monto = parseFloat(document.getElementById('mov-monto').value);
  const fecha = document.getElementById('mov-fecha').value || toISO(new Date());
  const nota = document.getElementById('mov-nota').value;
  const categoria = document.getElementById('mov-categoria').value || 'General';
  if(!monto || monto <= 0){ alert('Ingresa un monto válido.'); return; }

  data.gastos.push({ id: uid('g'), monto, fecha, nota, categoria });
  saveData(); closeModal(); render();
}

function eliminarMov(tipo, id){
  if(tipo === 'ingreso') data.ingresos = data.ingresos.filter(i => i.id !== id);
  else data.gastos = data.gastos.filter(g => g.id !== id);
  saveData(); render();
}

function openDeudaForm(editId = null){
  const deuda = editId ? data.deudas.find(item => item.id === editId) : null;
  const dias = diasPagoOrdenados();
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${deuda ? 'Editar crédito' : 'Agregar crédito'}</h3>
        <p class="modal-sub">${deuda ? 'Ajusta los parámetros del crédito.' : 'Registra el saldo pendiente de hoy y sus condiciones.'}</p>
        <label>Entidad o nombre del crédito</label>
        <input type="text" id="d-nombre" value="${escapeHtml(deuda ? deuda.nombre : '')}" placeholder="Ej. Crédito Colsubsidio">
        <label>Tipo de crédito</label>
        <select id="d-tipo">
          <option value="revolvente" ${deuda && deuda.tipo === 'revolvente' ? 'selected' : ''}>Crédito rotativo</option>
          <option value="cuota_fija" ${deuda && deuda.tipo === 'cuota_fija' ? 'selected' : ''}>Cuota fija</option>
          <option value="tarjeta" ${deuda && deuda.tipo === 'tarjeta' ? 'selected' : ''}>Tarjeta de crédito</option>
        </select>
        ${deuda ? '' : `<label>Saldo pendiente actual ($)</label><input type="number" id="d-saldo" min="0" step="1" placeholder="0">`}
        <div class="two-col">
          <div><label>Tasa mensual (% MV)</label><input type="number" id="d-interes" min="0" step="0.01" value="${deuda ? Number(deuda.tasaInteresMensual) || 0 : ''}" placeholder="Ej. 2,16"></div>
          <div><label>Cuota mensual ($)</label><input type="number" id="d-cuota" min="0" step="1" value="${deuda ? Number(deuda.cuotaValor) || '' : ''}" placeholder="0"></div>
        </div>
        <label>Día habitual de pago</label>
        <select id="d-quincena">
          ${dias.map(dia => `<option value="${dia}" ${deuda ? Number(deuda.quincenaPago) === dia ? 'selected' : '' : dia === dias[0] ? 'selected' : ''}>Día ${dia}</option>`).join('')}
        </select>
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn primary" onclick="guardarDeuda('${editId || ''}')">Guardar crédito</button>
        </div>
      </div>
    </div>`;
}

function guardarDeuda(editId){
  const nombre = document.getElementById('d-nombre').value.trim();
  const tipo = document.getElementById('d-tipo').value;
  const interes = Number(document.getElementById('d-interes').value);
  const cuota = Number(document.getElementById('d-cuota').value) || 0;
  const diaPago = Number(document.getElementById('d-quincena').value);
  const fechaHoy = toISO(new Date());

  if(!nombre || !Number.isFinite(interes) || interes < 0){
    alert('Revisa el nombre y la tasa del crédito.');
    return;
  }

  if(editId){
    const deuda = data.deudas.find(item => item.id === editId);
    if(!deuda) return;
    deuda.nombre = nombre;
    deuda.tipo = tipo;
    deuda.tasaInteresMensual = interes;
    deuda.cuotaValor = cuota;
    deuda.quincenaPago = diaPago;
    deuda.fechaUltimaActualizacion = fechaHoy;
  } else {
    const saldo = Number(document.getElementById('d-saldo').value);
    if(!Number.isFinite(saldo) || saldo <= 0){
      alert('Ingresa un saldo inicial mayor que cero.');
      return;
    }
    data.deudas.push({
      id: uid('d'),
      nombre,
      tipo,
      saldoInicial: saldo,
      saldoActual: saldo,
      tasaInteresMensual: interes,
      cuotaValor: cuota,
      cuotasTotales: null,
      cuotasPagadas: 0,
      quincenaPago: diaPago,
      activo: true,
      fechaUltimaActualizacion: fechaHoy,
      historialPagos: [{ id: uid('m'), fecha: fechaHoy, tipo: 'saldo_inicial', monto: saldo, nota: 'Saldo inicial' }]
    });
  }
  saveData(); closeModal(); render();
}

function registrarMovimientoDeuda(id, tipo){
  const deuda = data.deudas.find(item => item.id === id);
  if(!deuda) return;
  const esPago = tipo === 'pago';
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${esPago ? 'Registrar pago' : 'Registrar retiro'}</h3>
        <p class="modal-sub">${escapeHtml(deuda.nombre)} · Saldo actual ${fmt(deuda.saldoActual)}</p>
        <label>Valor ($)</label>
        <input type="number" id="mov-deuda-monto" min="1" step="1" value="${esPago ? Math.min(Number(deuda.cuotaValor) || Number(deuda.saldoActual), Number(deuda.saldoActual)) : ''}" oninput="actualizarPreviewCuotas()" placeholder="0">
        ${!esPago && deuda.tipo === 'tarjeta' ? `
        <label for="mov-deuda-cuotas">Número de cuotas</label>
        <input type="number" id="mov-deuda-cuotas" min="1" max="60" step="1" value="1" oninput="actualizarPreviewCuotas()" placeholder="1">
        <div class="hint" id="mov-deuda-cuotas-preview">La primera cuota se pagará el próximo mes. El cálculo no incluye intereses o cargos de la entidad; la última cuota se ajusta por redondeo.</div>` : ''}
        <label>Fecha del movimiento</label>
        <input type="date" id="mov-deuda-fecha" value="${toISO(new Date())}">
        <label>Detalle (opcional)</label>
        <input type="text" id="mov-deuda-nota" placeholder="${esPago ? 'Ej. Pago cuota' : 'Ej. Avance de cupo'}">
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn primary" onclick="confirmarMovimientoDeuda('${id}','${tipo}')">${esPago ? 'Aplicar pago' : 'Agregar al saldo'}</button>
        </div>
      </div>
    </div>`;
  actualizarPreviewCuotas();
}

function actualizarPreviewCuotas(){
  const montoInput = document.getElementById('mov-deuda-monto');
  const cuotasInput = document.getElementById('mov-deuda-cuotas');
  const preview = document.getElementById('mov-deuda-cuotas-preview');
  if(!montoInput || !cuotasInput || !preview) return;
  const monto = Number(montoInput.value);
  const cuotas = Number(cuotasInput.value);
  if(!Number.isFinite(monto) || monto <= 0 || !Number.isInteger(cuotas) || cuotas < 1 || cuotas > 60){
    preview.textContent = 'Ingresa el valor del retiro y un número de cuotas entre 1 y 60.';
    return;
  }
  preview.textContent = `Cuota mensual aproximada: ${fmt(Math.floor(monto / cuotas))}. La primera cuota se pagará el próximo mes; la última se ajusta por redondeo. No incluye intereses o cargos de la entidad.`;
}

function confirmarMovimientoDeuda(id, tipo){
  const deuda = data.deudas.find(item => item.id === id);
  if(!deuda) return;
  const monto = Number(document.getElementById('mov-deuda-monto').value);
  const fecha = document.getElementById('mov-deuda-fecha').value || toISO(new Date());
  const nota = document.getElementById('mov-deuda-nota').value.trim();
  const hoy = toISO(new Date());

  if(!Number.isFinite(monto) || monto <= 0){ alert('Ingresa un valor mayor que cero.'); return; }

  const pago = tipo === 'pago';
  const cuotasInput = document.getElementById('mov-deuda-cuotas');
  const cuotas = cuotasInput ? Number(cuotasInput.value) : null;
  if(cuotasInput && (!Number.isInteger(cuotas) || cuotas < 1 || cuotas > 60)){
    alert('Ingresa un número de cuotas entre 1 y 60.');
    return;
  }

  deuda.saldoActual = Math.max(0, Number(deuda.saldoActual || 0) + (pago ? -monto : monto));
  deuda.fechaUltimaActualizacion = hoy;
  deuda.historialPagos = deuda.historialPagos || [];
  const movimiento = { id: uid('m'), fecha, tipo: pago ? 'pago' : 'retiro', monto, nota };
  if(!pago && cuotasInput){
    const fechaMovimiento = parseDate(fecha);
    if(deuda.saldoBaseCuotas === undefined){
      deuda.saldoBaseCuotas = Number(deuda.saldoActual) || 0;
      deuda.fechaInicioBaseCuotas = fecha;
    }
    movimiento.cuotasTotales = cuotas;
    movimiento.fechaPrimeraCuota = toISO(new Date(fechaMovimiento.getFullYear(), fechaMovimiento.getMonth() + 1, 1));
  }
  deuda.historialPagos.push(movimiento);

  saveData(); closeModal(); render();
}

function actualizarSaldoRappi(){
  const deuda = data.deudas.find(item => item.id === 'd_rappi');
  if(!deuda) return;
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>Actualizar saldo de RappiCard</h3>
        <label>Saldo que muestra RappiCard ($)</label>
        <input type="number" id="rappi-saldo" value="${Number(deuda.saldoActual) || 0}">
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn primary" onclick="confirmarSaldoRappi()">Guardar saldo</button>
        </div>
      </div>
    </div>`;
}

function confirmarSaldoRappi(){
  const deuda = data.deudas.find(item => item.id === 'd_rappi');
  if(!deuda) return;
  const saldo = Number(document.getElementById('rappi-saldo').value);
  if(!Number.isFinite(saldo) || saldo < 0){ alert('Ingresa un saldo válido.'); return; }

  const saldoAnterior = Number(deuda.saldoActual) || 0;
  deuda.saldoActual = saldo;
  deuda.fechaUltimaActualizacion = toISO(new Date());
  deuda.historialPagos = deuda.historialPagos || [];
  deuda.historialPagos.push({
    id: uid('m'), fecha: toISO(new Date()), tipo: 'ajuste_saldo', monto: Math.abs(saldo - saldoAnterior),
    nota: `Saldo actualizado de ${fmt(saldoAnterior)} a ${fmt(saldo)}`
  });

  saveData(); closeModal(); render();
}

function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }
document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
window.addEventListener('focus', () => { calcularInteresDiarioAcumulado(); render(); });
document.addEventListener('visibilitychange', () => {
  if(!document.hidden){ calcularInteresDiarioAcumulado(); render(); }
});

loadData();
</script>
</body>
</html>

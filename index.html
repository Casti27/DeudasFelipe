  @media (max-width: 520px) {

    .fab { right: 18px; }

</style>

const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function normalizeData(raw){
  const base = initialBaseData();
  const next = raw && typeof raw === 'object' ? raw : {};
  const normalized = {
    ...base,
    ...next,
    config: { ...base.config, ...(next.config || {}) },
    ingresos: Array.isArray(next.ingresos) ? next.ingresos : base.ingresos,
    gastos: Array.isArray(next.gastos) ? next.gastos : base.gastos,
    deudas: (Array.isArray(next.deudas) ? next.deudas : base.deudas).map(deuda => ({
      ...deuda,
      historialPagos: Array.isArray(deuda.historialPagos) ? deuda.historialPagos : []
    })),
    saldoAcumuladoAnterior: Number(next.saldoAcumuladoAnterior || 0),
    migrations: Array.isArray(next.migrations) ? next.migrations : []
  };
  const colsub = normalized.deudas.find(deuda => deuda.id === 'd_colsub');
  if(colsub && !normalized.migrations.includes('colsub-216mv-withdrawal-20261001')){
    colsub.tasaInteresMensual = 2.16;
    const fechaMovimiento = '2026-10-01';
    const fechaActualizacion = colsub.fechaUltimaActualizacion || fechaMovimiento;
    const desde = midnight(parseDate(fechaActualizacion));
    const hasta = midnight(parseDate(fechaMovimiento));
    const diasTranscurridos = Math.max(0, Math.floor((hasta - desde) / 86400000));
    if(diasTranscurridos > 0){
      const tasaDiaria = Math.pow(1 + colsub.tasaInteresMensual / 100, 1 / 30) - 1;
      colsub.saldoActual = Math.round(Number(colsub.saldoActual || 0) * Math.pow(1 + tasaDiaria, diasTranscurridos));
    }
    colsub.saldoActual = Number(colsub.saldoActual || 0) + 300000;
    colsub.saldoInicial = Number(colsub.saldoInicial || 0) + 300000;
    colsub.fechaUltimaActualizacion = fechaMovimiento;
    colsub.historialPagos.push({
      id: 'm_colsub_retiro_20261001',
      fecha: fechaMovimiento,
      tipo: 'retiro',
      monto: 300000,
      nota: 'Retiro de cupo'
    });
    normalized.migrations.push('colsub-216mv-withdrawal-20261001');
  }
  return normalized;
}

function applyLatestFinancialSnapshot(){
  const migrationId = 'user-snapshot-20261002-v1';
  if(data.migrations.includes(migrationId)) return;
  const snapshot = initialBaseData();
  data.saldoAcumuladoAnterior = snapshot.saldoAcumuladoAnterior;
  data.config = snapshot.config;
  data.ingresos = snapshot.ingresos;
  data.gastos = snapshot.gastos;
  data.deudas = snapshot.deudas;
  data.migrations = [...new Set([...(data.migrations || []), ...snapshot.migrations, migrationId])];
}

function applyColsubAdvanceRate(){
  const migrationId = 'colsub-advance-rate-213nm-20261002';
  if(data.migrations.includes(migrationId)) return;
  const colsub = data.deudas.find(deuda => deuda.id === 'd_colsub');
  if(!colsub) return;
  colsub.tasaInteresMensual = 2.13;
  colsub.tasaMoraMensual = 2.16;
  colsub.fechaUltimaActualizacion = toISO(new Date());
  colsub.historialPagos = colsub.historialPagos || [];
  if(!colsub.historialPagos.some(movimiento => movimiento.id === 'm_colsub_retiro_20261001')){
    colsub.historialPagos.push({
      id: 'm_colsub_retiro_20261001',
      fecha: '2026-10-01',
      tipo: 'retiro',
      monto: 300000,
      nota: 'Retiro de cupo reportado; incluido en el saldo actual'
    });
  }
  data.migrations.push(migrationId);
}

function applyUserSnapshot(){
  const migrationId = 'user-snapshot-20261002-v1';
  if(data.migrations.includes(migrationId)) return;
  const snapshot = initialBaseData();
  data.saldoAcumuladoAnterior = snapshot.saldoAcumuladoAnterior;
  data.config = snapshot.config;
  data.ingresos = snapshot.ingresos;
  data.gastos = snapshot.gastos;
  data.deudas = snapshot.deudas;
  data.migrations = [...new Set([...(data.migrations || []), ...snapshot.migrations, migrationId])];
}

function applyMotoPaymentSchedule(){
  const migrationId = 'moto-payment-day-5-20261002-v2';
  if(data.migrations.includes(migrationId)) return;
  const moto = data.deudas.find(deuda => deuda.id === 'd_moto');
  if(moto) moto.quincenaPago = 5;
  data.migrations.push(migrationId);
}

function applyClaroCardPayment(){
  const migrationId = 'claro-paid-with-rappicard-20261002';
  if(data.migrations.includes(migrationId)) return;
  data.gastos = data.gastos || [];
  data.gastos = data.gastos.filter(gasto => gasto.id !== 'g_claro');
  data.migrations.push(migrationId);
}

function loadData(){
  try {
    const local = localStorage.getItem(APP_STORAGE_KEY);
    data = normalizeData(local ? JSON.parse(local) : initialBaseData());
  } catch(e){
    data = initialBaseData();
  }
  applyLatestFinancialSnapshot();
  applyColsubAdvanceRate();
  applyUserSnapshot();
  applyMotoPaymentSchedule();
  applyClaroCardPayment();
  calcularInteresDiarioAcumulado();
  saveData();
  render();
}

function calcularInteresDiarioAcumulado(){
  if(!data || !data.deudas) return;
  const hoy = midnight(new Date());
  let modificado = false;

  data.deudas.forEach(d => {
    if(!d.activo || !d.tasaInteresMensual || d.tasaInteresMensual <= 0 || d.saldoActual <= 0) return;
    const fechaUlt = d.fechaUltimaActualizacion ? parseDate(d.fechaUltimaActualizacion) : hoy;
    const ultM = midnight(fechaUlt);
    const diffTime = hoy.getTime() - ultM.getTime();
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

    if(diffDays > 0) {
      const tasaDiaria = Math.pow(1 + Number(d.tasaInteresMensual) / 100, 1 / 30) - 1;
      d.saldoActual = Math.round(Number(d.saldoActual) * Math.pow(1 + tasaDiaria, diffDays));
      d.fechaUltimaActualizacion = toISO(hoy);
      modificado = true;
    }
  });

  if(modificado) saveData();
}

function fmt(n){
  const val = Math.round(Number(n)||0);
  return new Intl.NumberFormat('es-CO', {
    style: 'currency',
    currency: data.config.moneda || 'COP',
    maximumFractionDigits: 0
  }).format(val);
}

function parseDate(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function diasPagoOrdenados(){
  return [...data.config.diasPago].sort((a,b) => a-b);
}

function getQuincenasOrdenadas(hoy){
  const hoyM = midnight(hoy);
  const diaMes = hoyM.getDate();

  let qActualPagaEl = (diaMes >= 6 && diaMes <= 20) ? 20 : 5;

  function calcPeriodo(pagaDia, offsetMes){
    let fin = new Date(hoyM.getFullYear(), hoyM.getMonth() + offsetMes, pagaDia);
    let inicio = new Date(fin);
    if(pagaDia === 20){
      inicio.setDate(6);
    } else {
      inicio.setMonth(inicio.getMonth() - 1);
      inicio.setDate(21);
    }
    return { pagaEl: pagaDia, inicio, fin, rango: rangoLabel(inicio, fin) };
  }

  if(qActualPagaEl === 20){
    return {
      q1: calcPeriodo(20, 0),       // Quincena Activa Actual (6–20 sep)
      q2: calcPeriodo(5, 1)         // Siguiente Quincena (21 sep – 5 oct)
    };
  } else {
    let off1 = diaMes >= 21 ? 1 : 0;
    return {
      q1: calcPeriodo(5, off1),
      q2: calcPeriodo(20, off1)
    };
  }
}

function rangoLabel(inicio, fin){
  if(inicio.getMonth() === fin.getMonth()) return `${inicio.getDate()}–${fin.getDate()} ${MESES[fin.getMonth()]}`;
  return `${inicio.getDate()} ${MESES[inicio.getMonth()]} – ${fin.getDate()} ${MESES[fin.getMonth()]}`;
}

function enRango(iso, inicio, fin){ const d = parseDate(iso); return d >= inicio && d <= fin; }

function ingresoAutomatico(periodo){
  if(periodo.pagaEl === 5){
    return 1390548;
  } else if(periodo.pagaEl === 20){
    return 1090548;
  }
  return 0;
}

function sumIngresosManuales(inicio, fin){
  return data.ingresos.filter(i => enRango(i.fecha, inicio, fin)).reduce((a,b) => a + Number(b.monto), 0);
}

function sumGastos(inicio, fin, periodo){
  return data.gastos.reduce((acc, g) => {
    if(g.quincenaPago) {
      return g.quincenaPago === periodo.pagaEl ? acc + Number(g.monto) : acc;
    }
    return enRango(g.fecha, inicio, fin) ? acc + Number(g.monto) : acc;
  }, 0);
}

function getCompromisosDeudasDetalle(periodo){
  let lista = [];
  data.deudas.filter(d => d.activo).forEach(d => {
    let cuotaProg = 0;
    if(d.tipo === 'tarjeta' && d.quincenaPago === periodo.pagaEl){
      cuotaProg = Number(d.saldoActual);
    } else if(d.quincenaPago === 'ambas'){
      cuotaProg = Number(d.cuotaValor) / 2;
    } else if(d.quincenaPago === periodo.pagaEl){
      cuotaProg = Number(d.cuotaValor);
    }

    if(cuotaProg > 0){
      let pagadoEnQ = 0;
      (d.historialPagos || []).forEach(p => {
        if(p.pago && enRango(p.fecha, periodo.inicio, periodo.fin)){
          pagadoEnQ += Number(p.pago);
        }
      });
      let egresoReal = Math.max(cuotaProg, pagadoEnQ);
      let pendiente = Math.max(0, cuotaProg - pagadoEnQ);
      lista.push({ nombre: d.nombre, cuotaProgramada: cuotaProg, pagado: pagadoEnQ, egresoReal: egresoReal, pendiente: pendiente, id: d.id });
    }
  });
  return lista;
}

function getPagosQuincena(periodo){
  const detalles = [];
  data.deudas.filter(deuda => deuda.activo && Number(deuda.saldoActual) > 0).forEach(deuda => {
    const pagoDia = Number(periodo.pagaEl);
    const correspondeQuincena = deuda.quincenaPago === 'ambas' || Number(deuda.quincenaPago) === pagoDia;
    const pagoAsignado = deuda.tipo === 'tarjeta' && correspondeQuincena
      ? Number(deuda.saldoActual) || 0
      : deuda.quincenaPago === 'ambas'
        ? Number(deuda.cuotaValor || 0) / 2
        : Number(deuda.quincenaPago) === pagoDia ? Number(deuda.cuotaValor || 0) : 0;
    if(pagoAsignado <= 0) return;
    const pagado = (deuda.historialPagos || []).reduce((total, movimiento) => {
      if(!movimiento.fecha || !enRango(movimiento.fecha, periodo.inicio, periodo.fin)) return total;
      const tipo = movimiento.tipo || (movimiento.pago ? 'pago' : movimiento.compra ? 'compra' : 'retiro');
      return tipo === 'pago' ? total + Number(movimiento.monto || movimiento.pago || 0) : total;
    }, 0);
    detalles.push({
      id: deuda.id,
      nombre: deuda.nombre,
      cuota: pagoAsignado,
      pagado: deuda.tipo === 'tarjeta' ? 0 : pagado,
      pendiente: deuda.tipo === 'tarjeta' ? pagoAsignado : Math.max(0, pagoAsignado - pagado),
      tarjeta: deuda.tipo === 'tarjeta',
      gasto: false
    });
  });
  data.gastos.filter(gasto => Number(gasto.quincenaPago) === Number(periodo.pagaEl)).forEach(gasto => {
    const monto = Number(gasto.monto) || 0;
    if(monto <= 0) return;
    detalles.push({
      id: gasto.id,
      nombre: gasto.nota || gasto.categoria || 'Gasto fijo',
      cuota: monto,
      pagado: 0,
      pendiente: monto,
      tarjeta: false,
      gasto: true
    });
  });
  return {
    detalles,
    total: detalles.reduce((total, detalle) => total + detalle.cuota, 0),
    pagado: detalles.reduce((total, detalle) => total + Math.min(detalle.cuota, detalle.pagado), 0),
    pendiente: detalles.reduce((total, detalle) => total + detalle.pendiente, 0),
    tarjetaSaldoTotal: detalles.filter(detalle => detalle.tarjeta).reduce((total, detalle) => total + detalle.cuota, 0)
  };
}

function interesDiario(deuda){
  const tasa = Number(deuda.tasaInteresMensual) || 0;
  if(tasa <= 0) return 0;
  const diaria = Math.pow(1 + tasa / 100, 1 / 30) - 1;
  return Math.round((Number(deuda.saldoActual) || 0) * diaria);
}

function mesesParaPagar(deuda){
  const saldo = Number(deuda.saldoActual) || 0;
  const cuota = Number(deuda.cuotaValor) || 0;
  const tasa = (Number(deuda.tasaInteresMensual) || 0) / 100;
  if(saldo <= 0) return 0;
  if(cuota <= 0) return null;
  if(tasa === 0) return Math.ceil(saldo / cuota);
  if(cuota <= saldo * tasa) return null;
  return Math.ceil(-Math.log(1 - tasa * saldo / cuota) / Math.log(1 + tasa));
}

function plazoLabel(deuda){
  const meses = mesesParaPagar(deuda);
  if(meses === 0) return 'Pagado';
  if(meses === null || !Number.isFinite(meses)) return 'Cuota insuficiente';
  if(meses < 12) return `${meses} ${meses === 1 ? 'mes' : 'meses'}`;
  const anios = Math.floor(meses / 12);
  const restantes = meses % 12;
  return `${anios} ${anios === 1 ? 'año' : 'años'}${restantes ? `, ${restantes} ${restantes === 1 ? 'mes' : 'meses'}` : ''}`;
}

function fechaLabel(iso){
  if(!iso) return '';
  return parseDate(iso).toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' });
}

function exportarRespaldo(){
  const jsonStr = JSON.stringify(data);
  navigator.clipboard.writeText(jsonStr).then(() => {

  }).catch(() => {

function aplicarRespaldo(){
  const txt = document.getElementById('import-json').value.trim();
  if(!txt){ alert('Pega un texto de respaldo válido.'); return; }
  try {
    const parsed = JSON.parse(txt);
    if(parsed && parsed.deudas){
      data = normalizeData(parsed);
      data.migrations = [...new Set([...(data.migrations || []), 'latest-financial-snapshot-correction-20261002-v2'])];
      applyColsubAdvanceRate();
      applyUserSnapshot();
      applyMotoPaymentSchedule();
      applyClaroCardPayment();
      calcularInteresDiarioAcumulado();
      saveData();
      closeModal();
      render();
      alert('¡Datos restaurados con éxito!');
    } else {
      alert('El formato del respaldo no es válido.');
    }
  } catch(e){
    alert('Error al leer el respaldo. Asegúrate de copiarlo completo.');
  }
}

function guardarAjustes(){
  const d1 = parseInt(document.getElementById('a-dia1').value, 10);

  if(d1 >= 1 && d1 <= 28 && d2 >= 1 && d2 <= 28 && d1 !== d2) data.config.diasPago = [d1, d2];

  saveData();
  render();
}

function borrarTodo(){
  if(confirm('¿Restablecer y borrar todos los datos locales?')){
    data = normalizeData(initialBaseData());
    saveData();
    render();
  }
}

function guardarDeudaLegacy(editId){
  const nombre = document.getElementById('d-nombre').value.trim();
  const saldo = parseFloat(document.getElementById('d-saldo').value);
  const tipo = window._deudaTipo;
  const cuotasTotales = parseInt(document.getElementById('d-cuotas-totales').value, 10) || null;
  const interes = (tipo === 'revolvente') ? (parseFloat(document.getElementById('d-interes').value)||0) : 0;

  if(!nombre || isNaN(saldo) || (tipo === 'cuota_fija' && (!cuotasTotales || cuotasTotales <= 0))){
    alert('Ingresa nombre, saldo y número de cuotas válidos.'); return;
  }

  const cuota = tipo === 'cuota_fija' ? Math.round(saldo / cuotasTotales) : 0;

  if(editId){
    let d = data.deudas.find(x => x.id === editId);
    if(d){
      d.nombre = nombre; d.tipo = tipo; d.saldoActual = saldo;
      d.cuotaValor = cuota; d.cuotasTotales = cuotasTotales;
      d.tasaInteresMensual = interes; d.quincenaPago = window._deudaQuincena;

  } else {
    data.deudas.push({

function confirmarPago(id){
  const d = data.deudas.find(x => x.id === id);
  const pago = parseFloat(document.getElementById('pago-monto').value);
  const fecha = document.getElementById('pago-fecha').value;
  if(isNaN(pago) || pago <= 0){ alert('Ingresa un monto válido.'); return; }

  const pagoAplicado = Math.min(pago, Number(d.saldoActual) || pago);
  d.saldoActual = Math.max(0, Number(d.saldoActual || 0) - pagoAplicado);

  const cuotaProgramada = Number(d.cuotaValor) || 0;
  if(d.tipo !== 'tarjeta' && cuotaProgramada > 0 && pagoAplicado >= cuotaProgramada * 0.98){
    d.cuotasPagadas = (d.cuotasPagadas || 0) + 1;
  }

  d.fechaUltimaActualizacion = toISO(new Date());
  d.historialPagos.push({ fecha, pago: pagoAplicado, saldoResultante: d.saldoActual });
  saveData(); closeModal(); render();
}

function guardarDeuda(editId){
  const nombre = document.getElementById('d-nombre').value.trim();
  const tipo = document.getElementById('d-tipo').value;
  const interes = Number(document.getElementById('d-interes').value);
  const cuota = Number(document.getElementById('d-cuota').value) || 0;
  const diaPago = Number(document.getElementById('d-quincena').value);
  const fechaHoy = toISO(new Date());
  if(!nombre || !Number.isFinite(interes) || interes < 0 || ![...diasPagoOrdenados()].includes(diaPago)){
    alert('Revisa el nombre, la tasa y el día de pago del crédito.');
    return;
  }

  if(editId){
    const deuda = data.deudas.find(item => item.id === editId);
    if(!deuda) return;
    deuda.nombre = nombre;
    deuda.tipo = tipo;
    deuda.tasaInteresMensual = interes;
    deuda.cuotaValor = cuota;
    deuda.quincenaPago = diaPago;
    deuda.fechaUltimaActualizacion = fechaHoy;
  } else {
    const saldo = Number(document.getElementById('d-saldo').value);
    if(!Number.isFinite(saldo) || saldo <= 0){
      alert('Ingresa un saldo inicial mayor que cero.');
      return;
    }
    data.deudas.push({
      id: uid('d'),
      nombre,
      tipo,
      saldoInicial: saldo,
      saldoActual: saldo,
      tasaInteresMensual: interes,
      cuotaValor: cuota,
      cuotasTotales: null,
      cuotasPagadas: 0,
      quincenaPago: diaPago,
      activo: true,
      fechaUltimaActualizacion: fechaHoy,
      historialPagos: [{
        id: uid('m'),
        fecha: fechaHoy,
        tipo: 'saldo_inicial',
        monto: saldo,
        nota: 'Saldo inicial registrado'
      }]
    });
  }
  saveData();
  closeModal();
  render();
}

function registrarMovimientoDeuda(id, tipo){
  const deuda = data.deudas.find(item => item.id === id);
  if(!deuda) return;
  const esPago = tipo === 'pago';
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${esPago ? 'Registrar pago' : 'Registrar retiro'}</h3>
        <p class="modal-sub">${escapeHtml(deuda.nombre)} · Saldo actual ${fmt(deuda.saldoActual)}</p>
        <label>Valor ($)</label>
        <input type="number" id="mov-deuda-monto" min="1" step="1" value="${esPago ? Math.min(Number(deuda.cuotaValor) || Number(deuda.saldoActual), Number(deuda.saldoActual)) : ''}" placeholder="0">
        <label>Fecha del movimiento</label>
        <input type="date" id="mov-deuda-fecha" value="${toISO(new Date())}" max="${toISO(new Date())}">
        <label>Detalle (opcional)</label>
        <input type="text" id="mov-deuda-nota" placeholder="${esPago ? 'Ej. Pago mínimo' : 'Ej. Retiro en Colsubsidio'}">
        <div class="hint">${esPago ? 'El abono se descontará del saldo pendiente.' : 'El valor se sumará al saldo y comenzará a generar intereses según la tasa configurada.'}</div>
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn primary" onclick="confirmarMovimientoDeuda('${id}','${tipo}')">${esPago ? 'Aplicar pago' : 'Agregar al saldo'}</button>
        </div>
      </div>
    </div>`;
}

function confirmarMovimientoDeuda(id, tipo){
  const deuda = data.deudas.find(item => item.id === id);
  if(!deuda) return;
  const monto = Number(document.getElementById('mov-deuda-monto').value);
  const fecha = document.getElementById('mov-deuda-fecha').value;
  const nota = document.getElementById('mov-deuda-nota').value.trim();
  const hoy = toISO(new Date());
  if(!Number.isFinite(monto) || monto <= 0){
    alert('Ingresa un valor mayor que cero.');
    return;
  }
  if(!fecha || fecha > hoy){
    alert('La fecha del movimiento debe ser hoy o anterior.');
    return;
  }

  const pago = tipo === 'pago';
  const diasDesdeMovimiento = Math.max(0, Math.floor((midnight(new Date()) - midnight(parseDate(fecha))) / 86400000));
  const tasaDiaria = Math.pow(1 + (Number(deuda.tasaInteresMensual) || 0) / 100, 1 / 30) - 1;
  const valorActualizado = Math.round(monto * Math.pow(1 + tasaDiaria, diasDesdeMovimiento));
  const valorAplicado = pago ? Math.min(valorActualizado, Number(deuda.saldoActual) || 0) : valorActualizado;
  deuda.saldoActual = Math.max(0, Number(deuda.saldoActual || 0) + (pago ? -valorAplicado : valorAplicado));
  if(!pago){
    deuda.saldoInicial = (Number(deuda.saldoInicial) || 0) + monto;
    deuda.activo = true;
  } else if(deuda.saldoActual === 0){
    deuda.activo = false;
  }
  deuda.fechaUltimaActualizacion = hoy;
  deuda.historialPagos = deuda.historialPagos || [];
  deuda.historialPagos.push({
    id: uid('m'),
    fecha,
    tipo: pago ? 'pago' : 'retiro',
    monto: monto,
    nota
  });
  if(pago && Number(deuda.cuotaValor) > 0 && valorAplicado >= Number(deuda.cuotaValor) * 0.98){
    deuda.cuotasPagadas = (deuda.cuotasPagadas || 0) + 1;
  }
  saveData();
  closeModal();
  render();
}

function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }
document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
window.addEventListener('focus', () => { calcularInteresDiarioAcumulado(); render(); });
document.addEventListener('visibilitychange', () => {
  if(!document.hidden){ calcularInteresDiarioAcumulado(); render(); }
});
loadData();
</script>
</body>
